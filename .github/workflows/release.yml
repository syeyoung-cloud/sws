# On a v* tag: build sws for Linux and macOS and publish them as the tag's GitHub release, with
# SHA-256 checksums.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  sws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build
        run: |
          set -eu
          mkdir dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${target%/*} arch=${target#*/}
            dir="sws_${GITHUB_REF_NAME#v}_${os}_${arch}"
            mkdir "dist/$dir"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "dist/$dir/sws" ./cmd/sws
            cp LICENSE "dist/$dir/"
            tar -C dist -czf "dist/$dir.tar.gz" "$dir"
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt \
            --title "$GITHUB_REF_NAME" \
            --notes "sws: download the archive for your system and put sws on your PATH. Or: go install github.com/cyoung06/sws/cmd/sws@$GITHUB_REF_NAME"
